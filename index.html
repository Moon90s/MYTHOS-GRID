<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>NEO-PANTHEON Database</title>
    <!-- Tailwind CSS สำหรับดีไซน์ที่สะอาดและทันสมัย -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold tracking-wider text-amber-400 mb-2">NEO-PANTHEON ARCHIVE</h1>
            <p class="text-slate-400">ฐานข้อมูลมหาปรากฏการณ์จุดตัดมิติ นีโอ-เทอร์ร่า</p>
        </header>

        <!-- ช่องค้นหาและกรองข้อมูล -->
        <div class="mb-8 flex justify-center">
            <input type="text" id="searchInput" placeholder="ค้นหาชื่อตัวละคร, รหัส (เช่น NP-001)..." 
                class="px-4 py-2 w-full max-w-md bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-amber-400 text-white"
                onkeyup="filterCharacters()">
        </div>

        <!-- พื้นที่แสดงการ์ดตัวละคร -->
        <div id="cardContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- ข้อมูลจะถูกโหลดมาแสดงที่นี่ผ่าน JavaScript -->
            <div class="text-center col-span-full text-slate-500 py-12">กำลังโหลดข้อมูลจากฐานข้อมูล...</div>
        </div>
    </div>

    <script>
        // แทนที่ด้วย Web App URL ที่ได้จากการ Deploy Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbxBt_B0JCzAHu_uWBS8dSlJQfyuMvi1Vo6iesOBGMFCjqEAMOWEdtNe_J4-eCBmk2-Obw/exec";
        let allCharacters = [];

        async function fetchCharacters() {
            try {
                const response = await fetch(API_URL);
                allCharacters = await response.json();
                displayCharacters(allCharacters);
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('cardContainer').innerHTML = `<div class="text-center col-span-full text-red-400">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
            }
        }

        function displayCharacters(characters) {
            const container = document.getElementById('cardContainer');
            container.innerHTML = "";

            if (characters.length === 0) {
                container.innerHTML = `<div class="text-center col-span-full text-slate-500 py-12">ไม่พบข้อมูลตัวละคร</div>`;
                return;
            }

            characters.forEach(char => {
                const card = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl hover:border-amber-400/50 transition duration-300 flex flex-col justify-between">
                        <div>
                            <div class="relative h-64 overflow-hidden bg-slate-950">
                                <img src="${char.Img_Urban_URL || 'https://via.placeholder.com/400x500?text=Neo-Pantheon'}" alt="${char.Name_TH}" class="w-full h-full object-cover object-center hover:scale-105 transition duration-500">
                                <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur border border-amber-400/30 text-amber-400 text-xs font-bold px-2.5 py-1 rounded-md uppercase">${char.Char_ID}</span>
                                <span class="absolute top-3 right-3 bg-amber-500 text-slate-950 text-xs font-bold px-2.5 py-1 rounded-md">${char.Rarity}</span>
                            </div>
                            <div class="p-5">
                                <div class="text-xs text-amber-400/80 mb-1">${char.Mythology} • ${char.Class_Role} • ${char.Element}</div>
                                <h3 class="text-xl font-bold text-white mb-1">${char.Name_TH} <span class="text-slate-400 font-normal text-sm">(${char.Name_EN})</span></h3>
                                <p class="text-xs text-slate-400 mb-4 line-clamp-1">ฉายา: ${char.Title}</p>
                                <p class="text-sm text-slate-300 line-clamp-3 mb-4">${char.Lore_NeoWorld}</p>
                            </div>
                        </div>
                        <div class="px-5 pb-5 pt-0">
                            <div class="grid grid-cols-5 gap-1 text-center text-xs bg-slate-950 p-2 rounded-lg border border-slate-800/60">
                                <div><span class="block text-slate-500">ATK</span><span class="font-bold text-amber-400">${char.Stat_ATK}</span></div>
                                <div><span class="block text-slate-500">DEF</span><span class="font-bold text-amber-400">${char.Stat_DEF}</span></div>
                                <div><span class="block text-slate-500">SPD</span><span class="font-bold text-amber-400">${char.Stat_SPD}</span></div>
                                <div><span class="block text-slate-500">HP</span><span class="font-bold text-amber-400">${char.Stat_HP}</span></div>
                                <div><span class="block text-slate-500">INT</span><span class="font-bold text-amber-400">${char.Stat_INT}</span></div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function filterCharacters() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allCharacters.filter(char => 
                (char.Name_TH && char.Name_TH.toLowerCase().includes(keyword)) ||
                (char.Name_EN && char.Name_EN.toLowerCase().includes(keyword)) ||
                (char.Char_ID && char.Char_ID.toLowerCase().includes(keyword)) ||
                (char.Mythology && char.Mythology.toLowerCase().includes(keyword))
            );
            displayCharacters(filtered);
        }

        fetchCharacters();
    </script>
</body>
</html>
